[preset.0]
name="Linux"
platform="Linux"
custom_features="graffitty_linux_frame"
runnable=true
export_filter="all_resources"
include_filter="mods/*.js,mods/*.json,mods/*.svg,scenes/*.js,scenes/icons/*.svg,scenes/icons/LUCIDE-LICENSE,scenes/icons/FONT-AWESOME-LICENSE,scenes/icons/README.md,config/*.conf,config/*.json,presets/*.conf,assets/icons/*.svg,assets/icons/*.png,assets/icons/lucide/*.svg,graffitty/build-info.json"
exclude_filter="worlds/*,tests/*,tools/*,**/*.blend,**/*.zip,**/*.tar,**/*.tar.gz"
script_export_mode=2

[preset.0.options]
binary_format/architecture="@ARCH@"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
