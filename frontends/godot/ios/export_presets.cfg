[preset.0]

name="iOS"
platform="iOS"
runnable=true
export_filter="all_resources"
include_filter="mods/*.js,mods/*.json,mods/*.svg,scenes/*.js,scenes/icons/*.svg,scenes/icons/*LICENSE*,scenes/icons/README.md,scenes/agents-LICENSE.txt,scenes/sounds/README.md,config/*.conf,config/*.json,presets/*.conf,assets/icons/*.svg,assets/icons/lucide/*.svg,graffitty/build-info.json"
exclude_filter="worlds/*,assets/browser/*,assets/videos/*,tests/*,tools/*"
export_path=""

[preset.0.options]

application/app_store_team_id=""
application/bundle_identifier="app.graffitty.client"
application/signature="GFTY"
application/short_version="0.1.0"
application/version="1"
application/min_ios_version="16.0"
application/targeted_device_family=2
application/export_project_only=true
application/additional_plist_content="<key>NSLocalNetworkUsageDescription</key><string>Graffitty uses your local network to connect to the Graffitty servers you add, so you can view and control your terminals.</string>"
privacy/microphone_usage_description="Graffitty records from the microphone only while you dictate, and sends the audio to your configured dictation service to turn it into text."
architectures/arm64=true
storyboard/custom_image@2x="res://assets/branding/exports/graffitty-icon-android-foreground.png"
storyboard/custom_image@3x="res://assets/branding/exports/graffitty-icon-android-foreground.png"
storyboard/use_custom_bg_color=false
