[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=true
export_filter="all_resources"
include_filter="mods/*.js,mods/*.json,mods/*.svg,scenes/*.js,scenes/icons/*.svg,scenes/icons/LUCIDE-LICENSE,scenes/icons/FONT-AWESOME-LICENSE,scenes/icons/README.md,config/*.conf,config/*.json,presets/*.conf,assets/icons/*.svg,assets/icons/lucide/*.svg,graffitty/build-info.json"
exclude_filter="worlds/*,assets/browser/*,assets/videos/*,fork/*,native/*,tests/*,docs/*,tools/*"
export_path="build/android/graffitty.apk"
script_export_mode=2

[preset.0.options]

custom_template/debug=""
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.0.1"
package/unique_name="com.graffitty.client"
package/name="Graffitty"
package/signed=true
package/app_category=2
launcher_icons/main_192x192="res://assets/branding/exports/graffitty-icon-macos.png"
launcher_icons/adaptive_foreground_432x432="res://assets/branding/exports/graffitty-icon-android-foreground.png"
launcher_icons/adaptive_background_432x432="res://assets/branding/exports/graffitty-icon-android-background.png"
launcher_icons/adaptive_monochrome_432x432="res://assets/branding/exports/graffitty-icon-android-monochrome.png"
screen/orientation=6
screen/immersive_mode=false
screen/edge_to_edge=false
screen/supported_screen_sizes/small=true
screen/supported_screen_sizes/normal=true
screen/supported_screen_sizes/large=true
screen/supported_screen_sizes/xlarge=true
permissions/internet=true
permissions/record_audio=true
permissions/vibrate=true
permissions/access_network_state=true
permissions/custom_permissions=PackedStringArray()
user_data_backup/allow=false
