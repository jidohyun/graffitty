; Default terminal scene preset: Mild (matches View > Mild).
; Loaded when no --config= is given. --no-fx turns the layer off entirely.

[behavior]
enter_duration = 0.8
idle_after = 1.5
leave_duration = 2.5

[scene.camera]
dof_blur_tint = "#6f5fa8"
dof_blur_tint_strength = 0.85
left_preserving_cursor_follow_threshold = 0.7
top_preserving_cursor_follow_threshold = 0.7
overscroll = 1.0
; Kitty images float prominently above the text during zoom/lean, settling at rest.
graphics_plane_lift = 0.20
graphics_plane_tilt_scale = 2.0

[scene.lighting]
strength = 0.6
minimum = 0.0
maximum = 1.4
color = "#fff0dc"

[scene.sheet]
typing_shape = "saddle"
; A small saddle bend, independently controlled from camera tilt.
curvature_deg = 2.0
content_gloss = 0.0
corner_radius = 18.0
edge_blur = 32.0

[scene.typing]
splash_scale = 0.2
splash_speed = 300.0
splash_life = 0.45

[state.idle]
camera.zoom = 1.0

[state.typing]
sheet.ripple = 0.04
sheet.curvature_deg = 1.5
typing.particles = "sparks"
; Typing camera: zoom toward the cursor and lean with it.
camera.zoom = 1.15
camera.tilt_limit_deg = 4.0
camera.drift_px = 2.0
camera.drift_speed = 0.7

[terminal]
bg = "#282c34"
fg = "#ffffff"
background_opacity = 0.28
padding = 24.0
