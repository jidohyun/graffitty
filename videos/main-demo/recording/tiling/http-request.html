<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTTP request · a visual explanation</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #192b43; background: #f4f6fa; font: 18px/1.4 system-ui, sans-serif; }
  main { max-width: 650px; height: 100vh; max-height: 760px; margin: auto; padding: 22px 24px; display: flex; flex-direction: column; }
  .eyebrow { color: #4665a1; font-size: 13px; font-weight: 700; letter-spacing: .14em; }
  h1 { font-size: 30px; line-height: 1.15; letter-spacing: -.035em; margin: 8px 0 18px; }
  #request-flow { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .node { flex: 1; display: flex; align-items: center; gap: 18px; padding: 10px 18px; border: 2px solid #bbcee9; border-radius: 16px; background: #fff; }
  .server { border-color: #83b5ab; background: #edf7f3; }
  .number { width: 40px; height: 40px; flex: 0 0 40px; display: grid; place-items: center; border-radius: 50%; background: #e8effb; color: #355991; font-weight: 750; }
  .server .number { background: #d5ebe2; color: #29665b; }
  h2 { margin: 0 0 4px; font-size: 23px; }
  p { margin: 0; color: #52647a; font-size: 17px; }
  code { font-size: 16px; color: #355991; }
  .edge { position: relative; flex: 0 0 40px; margin-left: 42px; border-left: 2px solid #6b87b2; }
  .edge::after { content: ''; position: absolute; left: -6px; bottom: 2px; width: 10px; height: 10px; border-right: 2px solid #6b87b2; border-bottom: 2px solid #6b87b2; transform: rotate(45deg); }
  .edge span { position: absolute; top: 8px; left: 20px; color: #52647a; font-size: 15px; }
  @media (max-width: 420px) { main { padding: 18px 16px; } h1 { font-size: 27px; } .node { padding: 10px; gap: 12px; } }
</style>
<main>
  <div class="eyebrow">REQUEST → RESPONSE</div>
  <h1>How an HTTP request works</h1>
  <div id="request-flow" role="img" aria-label="The chromium sends an HTTP request to a server. The server sends an HTML response back. The chromium renders the page.">
    <section class="node" data-stage="request"><div class="number">1</div><div><h2>Chromium</h2><p>Ask for a page</p><code>GET /index.html</code></div></section>
    <div class="edge"><span>HTTP request</span></div>
    <section class="node server" data-stage="server"><div class="number">2</div><div><h2>Web server</h2><p>Find or generate the HTML</p><code>200 OK + HTML</code></div></section>
    <div class="edge"><span>HTTP response</span></div>
    <section class="node" data-stage="render"><div class="number">3</div><div><h2>Chromium</h2><p>Parse the HTML and render the page</p></div></section>
  </div>
</main>
</html>
