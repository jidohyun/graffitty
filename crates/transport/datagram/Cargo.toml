[package]
name = "graffitty-video-datagram"
version.workspace = true
edition = "2024"
publish = false
description = "Encrypted, RTP-framed chromium video datagrams beside the WebSocket session"

[dependencies]
graffitty-remote-auth = { path = "../auth" }
reed-solomon-simd = "3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
graffitty-remote-auth = { path = "../auth" }
