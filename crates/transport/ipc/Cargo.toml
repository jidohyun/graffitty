[package]
name = "graffitty-session-transport"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[dependencies]
interprocess = "2.4.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_System_Pipes"] }

[dev-dependencies]
tempfile = "3"
