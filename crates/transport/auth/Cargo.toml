[package]
name = "graffitty-remote-auth"
version.workspace = true
edition = "2024"
publish = false

[features]
default = []

[dependencies]
graffitty-secrets = { path = "../../secrets" }
graffitty-protocol = { path = "../../protocol" }
rand = "0.10.3"
opaque-ke = { version = "4.0.1", features = ["argon2"] }
sha2 = "0.11.0"
# OPAQUE 4 uses digest 0.10 traits for its wire-compatible cipher suite.
sha2_opaque = { package = "sha2", version = "0.10.9" }
# OPAQUE also requires rand 0.8; enable its OS entropy source explicitly.
rand_opaque = { package = "rand", version = "0.8.8", features = ["getrandom"] }
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zeroize = { version = "1.9.0", features = ["serde"] }
hmac = "0.13.0"
hkdf = "0.13.0"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
subtle = "2.6.1"
ureq = { version = "3.4.2", features = ["json"] }

tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
uuid = { version = "1.27.0", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.2.0", features = ["v1"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4.2.0", features = ["v1"] }
[target.'cfg(target_os = "linux")'.dependencies.keyring]
version = "4.2.0"
features = ["v1"]
