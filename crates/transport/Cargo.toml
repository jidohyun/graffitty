[package]
name = "graffitty-transport"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
default = []
chromium-video = ["dep:graffitty-chromium-video"]

[dependencies]
graffitty-session-transport = { path = "ipc" }
graffitty-remote-auth = { path = "auth" }
graffitty-protocol = { path = "../protocol" }
graffitty-chromium-video = { path = "chromium-video", optional = true }
anyhow = "1"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
tungstenite = { version = "0.30.0", features = ["native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
# Android has no system OpenSSL development library. Use bundled public trust
# roots with Rustls so remote TLS remains available in the shared client.
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
