[package]
name = "graffitty-client-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
graffitty-terminal-core = { path = "../terminal-core" }
graffitty-protocol = { path = "../protocol" }
graffitty-fuzzy-rank = { path = "../fuzzy-rank" }
graffitty-transport = { path = "../transport" }
anyhow = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
fancy-regex = "0.20.1"
base64 = "0.23.1"
tempfile = "3"
libc = "0.2.190"
sys-locale = "0.3.2"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
sha2 = "0.11.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"] }
