[package]
name = "graffitty-dictation-audio"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[features]
device-capture = ["dep:cpal"]

[dependencies]
uuid = { version = "1.27.0", features = ["v4"] }
opus = "0.4"
ogg = "0.9"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
libloading = "0.9.0"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux", target_os = "ios"))'.dependencies]
cpal = { version = "0.18.2", optional = true }

[build-dependencies]
cc = "1"
