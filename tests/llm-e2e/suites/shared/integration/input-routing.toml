[[stages]]
name = "Verify fractional and application scrolling"
tools = []

[[stages]]
name = "Review visible configuration and failure preservation"
tools = []

[adapters.godot]
kind = "python"
platforms = ["windows"]
script = "../../../../platform/windows/windows_input_acceptance.py"
args = ["--suite", "input"]
