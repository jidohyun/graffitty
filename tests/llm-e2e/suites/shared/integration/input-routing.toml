goal = "Configured keys and terminal wheel events deliver their intended actions and exact PTY bytes without leaking consumed shortcuts or changing speed with font size."
verify = "raw_pty_bytes_and_rendered_ui"
tool_budget = 150
turn_timeout_seconds = 300

