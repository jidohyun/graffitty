required_frontends = ["godot"]

name = "new-terminal-window"
instructions = "new-terminal-window.md"
goal = "The split icons in a terminal window's title bar open another tiled terminal window beside or below that pane in the same tab, with its own shell and the keyboard. It never opens a chromium; the Chromium button does that."
