[state.idle]
camera.zoom = 1.0
camera.tilt_limit_deg = 0.0
camera.drift_px = 0.0

[state.typing]
camera.zoom = 1.0
camera.tilt_limit_deg = 0.0
camera.drift_px = 0.0

[scene.camera]
; Fixed typing zoom of 1.0: adaptive framing would move the saved view.
zoom_mode = "typing"
dof_blur_amount = 0.0

[scene.sheet]
typing_shape = "flat"
