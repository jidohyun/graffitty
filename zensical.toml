[project]
site_name = "Graffitty"
site_description = "A terminal workspace for your shells, browsers and coding agents"
docs_dir = "docs"
site_dir = "site"
# Local test evidence is maintained in the repository, not the user guide.
exclude_docs = """
developers/internals/tests/**
"""
extra_css = ["stylesheets/theme.css", "stylesheets/effects.css", "stylesheets/code-copy.css"]
extra_javascript = ["javascripts/effects.js", "javascripts/code-copy.js"]
# Repository URL reserved for the upcoming public launch.
